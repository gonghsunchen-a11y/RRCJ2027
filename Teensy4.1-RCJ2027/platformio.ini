; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[project_options]
;program_name = sense
;program_name = test
;program_name = act
;program_name = buffer_test
;program_name = line_test
;program_name = line_sensing
;program_name = mux2_test
;program_name = sense_defense
;program_name = act_defense
;program_name = dma_test
;program_name = backcourt
;program_name = lsdefense
program_name = sense_defense
;program_name = irsensing
;program_name = ir_act
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include
build_src_filter = +<*.h> +<${project_options.program_name}.cpp>    

[env:ir_act]
extends = env:teensy41
build_src_filter = +<ir_act.cpp>

[env:act_defense]
extends = env:teensy41
build_src_filter = +<act_defense.cpp>

[env:sense_defense]
extends = env:teensy41
build_src_filter = +<sense_defense.cpp>

[env:lsdefense]
extends = env:teensy41
build_src_filter = +<lsdefense.cpp>
